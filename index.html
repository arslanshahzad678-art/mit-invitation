    <script>
      // Polyfill/shim to allow extensions and test harnesses to safely override window.fetch
      // even when the environment defines fetch as a getter-only accessor on Window.
      (function() {
        try {
          var origFetch = window.fetch;
          var fetchHolder = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchHolder;
            },
            set: function(val) {
              fetchHolder = val;
            }
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            var protoHolder = typeof protoFetch === 'function' ? protoFetch.bind(window) : protoFetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return protoHolder;
              },
              set: function(val) {
                protoHolder = val;
              }
            });
          } catch (e2) {
            // ignore fallback error
          }
        }
      })();
    </script>
